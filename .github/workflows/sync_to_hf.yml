name: Sync to Hugging Face hub
on:
  push:
    branches: [main, jules-*]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Create a clean deployment directory
          TEMP_DIR=$(mktemp -d)
          cp Dockerfile $TEMP_DIR/
          cp README.md $TEMP_DIR/
          cp start.sh $TEMP_DIR/
          cp api_server.py $TEMP_DIR/
          cp nginx.conf $TEMP_DIR/

          cd $TEMP_DIR
          git init -b main
          git add .
          git commit -m "Deploy WitNote with VNC and API support"

          git push --force https://AUXteam:$HF_TOKEN@huggingface.co/spaces/AUXteam/WitNote main:main
