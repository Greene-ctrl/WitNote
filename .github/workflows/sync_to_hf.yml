name: Sync to Hugging Face hub
on:
  push:
    branches: [main, jules-*]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Create a clean deployment directory with source and essential build resources
          TEMP_DIR=$(mktemp -d)
          cp -r . $TEMP_DIR/
          cd $TEMP_DIR

          # Remove non-essential large directories to stay within HF push limits
          rm -rf docs/
          rm -rf "src/pic/witnote 宣传截图/"

          # Initialize a new git repo to ensure no heavy history
          rm -rf .git
          git init -b main

          git add .
          git commit -m "Deploy WitNote (VNC build from local source)"

          git push --force https://AUXteam:$HF_TOKEN@huggingface.co/spaces/AUXteam/WitNote main:main
