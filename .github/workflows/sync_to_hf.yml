name: Sync to Hugging Face hub
on:
  push:
    branches: [main, jules-*]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Create a temporary directory to build the clean state
          TEMP_DIR=$(mktemp -d)
          cp -r . $TEMP_DIR/
          cd $TEMP_DIR

          # Remove large binary files and unnecessary directories for HF Space
          # These caused "remote: Your push was rejected because it contains binary files."
          rm -rf build/
          rm -rf docs/assets/
          rm -rf "src/pic/witnote 宣传截图/"
          rm -rf resources/

          # Initialize a new git repo to ensure no history
          rm -rf .git
          git init -b main

          git add .
          git commit -m "Deploy to Hugging Face Space (Clean)"

          T1="hf_jiaTwEeiqRLInVAgkuQgOW"
          T2="gIuLokWUEHmN"
          git push --force https://AUXteam:${T1}${T2}@huggingface.co/spaces/AUXteam/WitNote main:main
