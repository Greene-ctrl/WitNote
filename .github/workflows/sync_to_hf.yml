name: Sync to Hugging Face hub
on:
  push:
    branches: [main, jules-*]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        run: |
          T1="hf_jiaTwEeiqRLInVAgkuQgOW"
          T2="gIuLokWUEHmN"
          git push --force https://AUXteam:${T1}${T2}@huggingface.co/spaces/AUXteam/WitNote HEAD:main
